[pytest]
# Pytest configuration

minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings

asyncio_mode = auto
